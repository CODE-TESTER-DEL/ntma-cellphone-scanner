  <style>

<body>
  <main class="wrap">
    <div class="top">
      <button class="back" id="back" type="button">← BACK</button>

      <div>
        <div class="title">NTMA Barcode Scanner</div>
        <div class="sub">Scan the gadget barcode</div>
      </div>
    </div>

    <div class="camera">
      <video id="video" muted playsinline autoplay></video>

      <div class="guide">
        <div class="guide-line"></div>
      </div>
    </div>

    <div class="camera-controls">
      <button
        id="torch"
        class="control-btn"
        type="button"
        disabled
      >
        🔦 FLASHLIGHT UNAVAILABLE
      </button>
    </div>

    <div id="torchStatus" class="help" aria-live="polite">
      Checking flashlight support…
    </div>

    <div id="status" class="status" aria-live="polite">
      Starting camera…
    </div>

    <button id="start" class="primary hidden" type="button">
      RETRY CAMERA
    </button>

    <div class="help">
      Align the barcode inside the box. Keep the phone steady and
      move it slightly farther away if the barcode looks blurry.
    </div>

    <div class="manual">
      <input
        id="manual"
        autocomplete="off"
        placeholder="Enter Gadget ID manually"
        aria-label="Gadget ID"
      >
      <button id="verify" type="button">VERIFY</button>
    </div>
  </main>

  <script src="https://unpkg.com/@zxing/library@0.21.3"></script>
  <script src="https://unpkg.com/@zxing/browser@0.1.5"></script>

  <script>
    const video = document.getElementById("video");
    const statusBox = document.getElementById("status");
    const torchBtn = document.getElementById("torch");
    const torchStatus = document.getElementById("torchStatus");
    const startBtn = document.getElementById("start");
    const manual = document.getElementById("manual");

    const APP_URL = "./";

    let reader = null;
    let controls = null;
    let stream = null;
    let busy = false;
    let starting = false;
    let torchAvailable = false;
    let torchOn = false;
    let lastCode = "";
    let lastCodeTime = 0;

    function setStatus(message, type = "") {
      statusBox.textContent = message;
      statusBox.className = "status" + (type ? " " + type : "");
    }

    function setTorchStatus(message) {
      torchStatus.textContent = message;
    }

    function resetTorchButton() {
      torchAvailable = false;
      torchOn = false;
      torchBtn.disabled = true;
      torchBtn.classList.remove("active");
      torchBtn.textContent = "🔦 FLASHLIGHT UNAVAILABLE";
      setTorchStatus("Flashlight controls are not available yet.");
    }

    function stopCamera() {
      try {
        if (controls && typeof controls.stop === "function") {
          controls.stop();
        }
      } catch (error) {
        console.warn("Could not stop scanner controls:", error);
      }

      controls = null;

      try {
        if (stream) {
          stream.getTracks().forEach(track => track.stop());
        }
      } catch (error) {
        console.warn("Could not stop camera stream:", error);
      }

      stream = null;
      video.srcObject = null;
      resetTorchButton();
    }

    function goBack() {
      stopCamera();
      window.location.href = APP_URL;
    }

    function finish(id) {
      id = String(id || "").trim();

      if (!id) {
        setStatus("Enter a valid Gadget ID.", "error");
        return;
      }

      if (busy) return;

      busy = true;
      setStatus("Gadget ID detected. Returning to the app…", "success");
      stopCamera();

      window.location.href =
        APP_URL + "?phoneId=" + encodeURIComponent(id);
    }

    async function applyAutofocus() {
      if (!stream) return;

      const track = stream.getVideoTracks()[0];

      if (!track || typeof track.applyConstraints !== "function") {
        return;
      }

      try {
        const capabilities =
          typeof track.getCapabilities === "function"
            ? track.getCapabilities()
            : {};

        const supported =
          navigator.mediaDevices.getSupportedConstraints
            ? navigator.mediaDevices.getSupportedConstraints()
            : {};

        const advanced = [];

        if (
          supported.focusMode &&
          capabilities.focusMode &&
          capabilities.focusMode.includes("continuous")
        ) {
          advanced.push({ focusMode: "continuous" });
        }

        if (advanced.length) {
          await track.applyConstraints({ advanced });
        }
      } catch (error) {
        console.warn("Autofocus setting was not applied:", error);
      }
    }

    function configureTorch() {
      resetTorchButton();

      if (!stream) return;

      const track = stream.getVideoTracks()[0];

      if (!track || typeof track.applyConstraints !== "function") {
        setTorchStatus("This browser does not expose flashlight controls.");
        return;
      }

      try {
        const capabilities =
          typeof track.getCapabilities === "function"
            ? track.getCapabilities()
            : {};

        if (capabilities.torch === true) {
          torchAvailable = true;
        } else {
          setTorchStatus(
            "Flashlight control is unsupported by this camera or browser."
          );
          return;
        }

        torchBtn.disabled = false;
        torchBtn.textContent = "🔦 TURN FLASHLIGHT ON";
        setTorchStatus("Flashlight ready.");
      } catch (error) {
        console.warn("Could not check flashlight support:", error);
        setTorchStatus("Could not detect flashlight support.");
      }
    }

    async function toggleTorch() {
      if (!stream || !torchAvailable || busy) return;

      const track = stream.getVideoTracks()[0];
      if (!track) return;

      const requestedState = !torchOn;

      torchBtn.disabled = true;
      setTorchStatus(
        requestedState
          ? "Turning flashlight on…"
          : "Turning flashlight off…"
      );

      try {
        await track.applyConstraints({
          advanced: [{ torch: requestedState }]
        });

        torchOn = requestedState;
        torchBtn.classList.toggle("active", torchOn);
        torchBtn.textContent = torchOn
          ? "🔦 TURN FLASHLIGHT OFF"
          : "🔦 TURN FLASHLIGHT ON";

        setTorchStatus(
          torchOn
            ? "Flashlight is ON."
            : "Flashlight is OFF."
        );
      } catch (error) {
        console.error("Flashlight toggle failed:", error);

        setTorchStatus(
          "Unable to control the flashlight. Your device may not support it."
        );
      } finally {
        torchBtn.disabled = !torchAvailable;
      }
    }

    async function startCamera() {
      if (busy || starting) return;

      starting = true;
      startBtn.disabled = true;
      startBtn.classList.add("hidden");

      stopCamera();

      try {
        if (
          !navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia
        ) {
          throw new Error(
            "Camera access is unavailable. Open this page over HTTPS."
          );
        }

        if (!window.ZXing || !window.ZXingBrowser) {
          throw new Error(
            "Barcode library failed to load. Check your internet connection."
          );
        }

        setStatus("Opening rear camera…");

        stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          }
        });

        video.srcObject = stream;
        await video.play();

        await applyAutofocus();
        configureTorch();

        const hints = new Map();

        hints.set(
          ZXing.DecodeHintType.POSSIBLE_FORMATS,
          [ZXing.BarcodeFormat.CODE_128]
        );

        hints.set(ZXing.DecodeHintType.TRY_HARDER, true);

        reader = new ZXingBrowser.BrowserMultiFormatReader(hints);

        setStatus(
          "Ready to scan. Keep the barcode inside the box and hold steady."
        );

        controls = await reader.decodeFromVideoElement(
          video,
          (result, error) => {
            if (!result || busy) return;

            const text = String(result.getText() || "").trim();
            if (!text) return;

            const now = Date.now();

            if (text === lastCode && now - lastCodeTime < 1500) {
              return;
            }

            lastCode = text;
            lastCodeTime = now;

            finish(text);
          }
        );

      } catch (error) {
        console.error("Scanner startup error:", error);
        stopCamera();

        setStatus(
          error && error.message
            ? error.message
            : "Camera unavailable. Allow camera access or enter the ID manually.",
          "error"
        );

        startBtn.classList.remove("hidden");

      } finally {
        starting = false;
        startBtn.disabled = false;
      }
    }

    document.getElementById("back")
      .addEventListener("click", goBack);

    torchBtn.addEventListener("click", toggleTorch);
    startBtn.addEventListener("click", startCamera);

    document.getElementById("verify")
      .addEventListener("click", () => finish(manual.value));

    manual.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        finish(manual.value);
      }
    });

    window.addEventListener("pagehide", stopCamera);

    startCamera();
  </script>
</body>
</html>
