  <style>
    * {
      box-sizing: border-box;

    body {
      margin: 0;
      min-height: 100vh;

<body>
  <main class="wrap">
    <div class="top">
      <button class="back" id="back" type="button">
        ← BACK
      </button>

      <div>
        <div class="title">NTMA Barcode Scanner</div>
        <div class="sub">Scan the gadget barcode</div>
      </div>
    </div>

    <div class="camera">
      <video id="video" muted playsinline autoplay></video>

      <div class="guide">
        <div class="guide-line"></div>
      </div>
    </div>

    <div id="status" class="status" aria-live="polite">
      Starting camera…
    </div>

    <button id="start" class="primary hidden" type="button">
      RETRY CAMERA
    </button>

    <div class="help">
      Align the barcode inside the box. Keep the phone steady and
      move it slightly farther away if the barcode looks blurry.
    </div>

    <div class="manual">
      <input
        id="manual"
        autocomplete="off"
        placeholder="Enter Gadget ID manually"
        aria-label="Gadget ID"
      >
      <button id="verify" type="button">VERIFY</button>
    </div>
  </main>

  <!-- Barcode format and decoding hints -->
  <script src="https://unpkg.com/@zxing/library@0.21.3"></script>

  <!-- Browser camera scanning -->
  <script src="https://unpkg.com/@zxing/browser@0.1.5"></script>

  <script>
    const video = document.getElementById("video");
    const statusBox = document.getElementById("status");
    const startBtn = document.getElementById("start");
    const manual = document.getElementById("manual");

    // Return to the main GitHub Pages app.
    const APP_URL = "./";

    let reader = null;
    let controls = null;
    let stream = null;
    let busy = false;
    let starting = false;
    let lastCode = "";
    let lastCodeTime = 0;

    function setStatus(message, type = "") {
      statusBox.textContent = message;
      statusBox.className = "status" + (type ? " " + type : "");
    }

    function stopCamera() {
      try {
        if (controls && typeof controls.stop === "function") {
          controls.stop();
        }
      } catch (error) {
        console.warn("Could not stop scanner controls:", error);
      }

      controls = null;

      try {
        if (stream) {
          stream.getTracks().forEach(track => track.stop());
        }
      } catch (error) {
        console.warn("Could not stop camera stream:", error);
      }

      stream = null;
      video.srcObject = null;
    }

    function goBack() {
      stopCamera();
      window.location.href = APP_URL;
    }

    function finish(id) {
      id = String(id || "").trim();

      if (!id) {
        setStatus("Enter a valid Gadget ID.", "error");
        return;
      }

      if (busy) return;

      busy = true;
      setStatus("Gadget ID detected. Returning to the app…", "success");
      stopCamera();

      window.location.href =
        APP_URL + "?phoneId=" + encodeURIComponent(id);
    }

    async function applyAutofocus() {
      if (!stream) return;

      const track = stream.getVideoTracks()[0];

      if (!track || typeof track.applyConstraints !== "function") {
        console.log("Manual focus constraints are unavailable.");
        return;
      }

      try {
        const capabilities =
          typeof track.getCapabilities === "function"
            ? track.getCapabilities()
            : {};

        const supported =
          navigator.mediaDevices.getSupportedConstraints
            ? navigator.mediaDevices.getSupportedConstraints()
            : {};

        const advanced = [];

        if (
          supported.focusMode &&
          capabilities.focusMode &&
          capabilities.focusMode.includes("continuous")
        ) {
          advanced.push({ focusMode: "continuous" });
        }

        if (
          supported.zoom &&
          capabilities.zoom &&
          typeof capabilities.zoom.min === "number"
        ) {
          // Do not force digital zoom. It can make small barcodes
          // blurrier on some devices.
          console.log(
            "Camera zoom range:",
            capabilities.zoom.min,
            capabilities.zoom.max
          );
        }

        if (advanced.length > 0) {
          await track.applyConstraints({ advanced });
          console.log("Continuous autofocus requested.");
        } else {
          console.log("Camera manages focus automatically.");
        }
      } catch (error) {
        // Some phones do not allow web pages to control focus.
        console.warn("Autofocus setting was not applied:", error);
      }
    }

    async function startCamera() {
      if (busy || starting) return;

      starting = true;
      startBtn.disabled = true;
      startBtn.classList.add("hidden");

      stopCamera();

      try {
        if (!navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia) {
          throw new Error(
            "Camera access is unavailable. Open this page over HTTPS."
          );
        }

        if (!window.ZXing || !window.ZXingBrowser) {
          throw new Error(
            "The barcode library did not load. Check your internet connection."
          );
        }

        setStatus("Opening rear camera…");

        const constraints = {
          audio: false,
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          }
        };

        stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;

        await video.play();
        await applyAutofocus();

        // NTMA Gadget IDs contain letters and numbers.
        // Code 128 supports alphanumeric IDs and hyphens.
        const hints = new Map();

        hints.set(
          ZXing.DecodeHintType.POSSIBLE_FORMATS,
          [ZXing.BarcodeFormat.CODE_128]
        );

        // Ask ZXing to spend more effort finding a difficult barcode.
        hints.set(ZXing.DecodeHintType.TRY_HARDER, true);

        reader = new ZXingBrowser.BrowserMultiFormatReader(hints);

        setStatus(
          "Ready to scan. Keep the barcode inside the box and hold steady."
        );

        // Repeatedly decode the live video feed.
        controls = await reader.decodeFromVideoElement(
          video,
          (result, error) => {
            if (!result || busy) return;

            const text = String(result.getText() || "").trim();
            if (!text) return;

            // Ignore rapid repeat detections of the same code.
            const now = Date.now();

            if (text === lastCode && now - lastCodeTime < 1500) {
              return;
            }

            lastCode = text;
            lastCodeTime = now;

            finish(text);
          }
        );

      } catch (error) {
        console.error("Scanner startup error:", error);
        stopCamera();

        setStatus(
          error && error.message
            ? error.message
            : "Camera unavailable. Allow camera access or enter the ID manually.",
          "error"
        );

        startBtn.classList.remove("hidden");

      } finally {
        starting = false;
        startBtn.disabled = false;
      }
    }

    document.getElementById("back")
      .addEventListener("click", goBack);

    startBtn.addEventListener("click", startCamera);

    document.getElementById("verify")
      .addEventListener("click", () => finish(manual.value));

    manual.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        finish(manual.value);
      }
    });

    window.addEventListener("pagehide", stopCamera);

    startCamera();
  </script>
</body>
</html>
