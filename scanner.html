  <title>NTMA Barcode Scanner</title>

  <style>
    * {
      box-sizing: border-box;

    body {
      margin: 0;

<body>
  <main class="wrap">
    <div class="top">
      <button class="back" id="back" type="button">
        ← BACK
      </button>

      <div>
        <div class="title">NTMA Barcode Scanner</div>
        <div class="sub">Scan the gadget barcode</div>
      </div>
    </div>

    <div class="camera">
      <video
        id="video"
        muted
        playsinline
        autoplay
      ></video>

      <div class="line"></div>
    </div>

    <div id="status" class="status" aria-live="polite">
      Starting camera…
    </div>

    <button id="start" class="primary hidden" type="button">
      RETRY CAMERA
    </button>

    <div class="camera-help">
      Keep the barcode steady and adjust the distance until it looks sharp.
    </div>

    <div class="manual">
      <input
        id="manual"
        autocomplete="off"
        placeholder="Enter Gadget ID manually"
        aria-label="Gadget ID"
      >

      <button id="verify" type="button">
        VERIFY
      </button>
    </div>
  </main>

  <script src="https://unpkg.com/@zxing/browser@latest"></script>

  <script>
    const video = document.getElementById("video");
    const statusBox = document.getElementById("status");
    const startBtn = document.getElementById("start");
    const manual = document.getElementById("manual");

    const APP_URL = "./";

    let controls = null;
    let reader = null;
    let stream = null;
    let busy = false;
    let starting = false;

    function status(message, cls = "") {
      statusBox.textContent = message;
      statusBox.className = "status" + (cls ? " " + cls : "");
    }

    function stopCamera() {
      try {
        if (controls && typeof controls.stop === "function") {
          controls.stop();
        }
      } catch (e) {
        console.warn("Scanner controls could not stop cleanly.", e);
      }

      controls = null;

      try {
        if (stream) {
          stream.getTracks().forEach(track => track.stop());
        }
      } catch (e) {
        console.warn("Camera stream could not stop cleanly.", e);
      }

      stream = null;
      video.srcObject = null;
    }

    function goBack() {
      stopCamera();
      window.location.href = APP_URL;
    }

    function finish(id) {
      id = String(id || "").trim();

      if (!id) {
        status("No Gadget ID detected. Scan again or enter the ID manually.", "error");
        return;
      }

      if (busy) return;

      busy = true;
      stopCamera();

      status("Barcode detected. Returning to the app…", "success");

      window.location.href =
        APP_URL + "?phoneId=" + encodeURIComponent(id);
    }

    async function applyFocusSettings() {
      if (!stream) return;

      const track = stream.getVideoTracks()[0];

      if (!track || typeof track.applyConstraints !== "function") {
        status("Camera running. Autofocus is managed by your device.");
        return;
      }

      try {
        const capabilities =
          typeof track.getCapabilities === "function"
            ? track.getCapabilities()
            : {};

        const supportedConstraints = navigator.mediaDevices
          && navigator.mediaDevices.getSupportedConstraints
          ? navigator.mediaDevices.getSupportedConstraints()
          : {};

        const focusModes = capabilities.focusMode || [];

        const advanced = [];

        if (
          supportedConstraints.focusMode &&
          focusModes.includes("continuous")
        ) {
          advanced.push({ focusMode: "continuous" });
        }

        if (
          supportedConstraints.focusDistance &&
          capabilities.focusDistance
        ) {
          const min = capabilities.focusDistance.min;
          const max = capabilities.focusDistance.max;

          // Do not force a distance: let autofocus choose first.
          // The capability check is kept for future device-specific tuning.
          console.log("Supported focus distance:", min, max);
        }

        if (advanced.length) {
          await track.applyConstraints({ advanced });
          status("Camera ready. Continuous autofocus requested.", "success");
        } else {
          status("Camera ready. Your phone controls autofocus automatically.");
        }
      } catch (e) {
        console.warn("Optional focus settings were not applied:", e);
        status("Camera ready. Autofocus is managed by your device.");
      }
    }

    async function startCamera() {
      if (busy || starting) return;

      starting = true;
      startBtn.disabled = true;
      startBtn.classList.add("hidden");

      stopCamera();

      try {
        if (!navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia) {
          throw new Error("Camera access requires a supported secure browser.");
        }

        if (!window.ZXingBrowser) {
          throw new Error("Scanner library did not load.");
        }

        status("Requesting camera access…");

        // Ask for the rear camera and a higher-resolution image.
        // Continuous focus is applied separately when supported.
        const cameraConstraints = {
          audio: false,
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          }
        };

        stream = await navigator.mediaDevices.getUserMedia(
          cameraConstraints
        );

        video.srcObject = stream;

        await video.play();

        await applyFocusSettings();

        reader = new ZXingBrowser.BrowserMultiFormatReader();

        status("Point the camera at the barcode. Hold it steady.");

        controls = await reader.decodeFromVideoElement(
          video,
          (result, error) => {
            if (result && !busy) {
              finish(result.getText());
            }
          }
        );

      } catch (e) {
        console.error("Scanner error:", e);

        stopCamera();

        status(
          "Camera unavailable. Allow camera access or enter the Gadget ID manually.",
          "error"
        );

        startBtn.classList.remove("hidden");
      } finally {
        starting = false;
        startBtn.disabled = false;
      }
    }

    document.getElementById("back").addEventListener("click", goBack);

    startBtn.addEventListener("click", () => {
      startCamera();
    });

    document.getElementById("verify").addEventListener("click", () => {
      finish(manual.value);
    });

    manual.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        finish(manual.value);
      }
    });

    window.addEventListener("pagehide", stopCamera);

    startCamera();
  </script>
</body>
</html>
